output_dir: ./quickstart/output
compliant: true
num_processes: 15

btps:
  algs:
    - type: polyprotect
      system_specific: false
      normalize_input: true
      binarize: false
      overlap: 3
      nb_coef: 5
      coef_range: 50
      method: minimize_cos
      precision: 3
      num_guesses: 100
      ks_method: legacy
