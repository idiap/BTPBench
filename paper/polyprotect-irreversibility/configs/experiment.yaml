output_dir: ./paper/polyprotect-irreversibility/output/soteria-iresnet100
save: true
compliant: true
num_processes: 2

n_attack_trials: 10
# Reproduction defaults chosen for repeatability.
attack_seed: 42
key_sampling_seed: 42
sampling_mode: configured

bio_alg: iresnet100
database: soteria
detector: mediapipe

btps:
  algs:
    - type: polyprotect
      system_specific: false
      normalize_input: true
      binarize: false
      overlap: 3
      nb_coef: 5
      coef_range: 50
      method: minimize_cos
      # Current BTPBench default; not specified in the manuscript.
      precision: 3
      num_guesses: 5
      ks_method: legacy
