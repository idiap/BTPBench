# Section III, Figs. 5-6: element ranges and t-SNE before input normalization.
output_dir: ./paper/polyprotect-irreversibility/output/soteria-iresnet100-unnormalized
save: true
compliant: true
num_processes: 2

bio_alg: iresnet100
database: soteria
detector: mediapipe

btps:
  algs:
    - type: polyprotect
      system_specific: false
      normalize_input: false
      binarize: false
      overlap: 3
      nb_coef: 5
      coef_range: 50
